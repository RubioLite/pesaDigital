; ============================================================================
;  pesaDigital - PlatformIO
;  Placa: ESP32 DevKit V1 (30 pines, ESP32-WROOM-32)
;  Etapa 0: esqueleto, configuracion, logger, scheduler, UI minima y Wokwi.
; ============================================================================

[platformio]
default_envs = esp32dev

; ----------------------------------------------------------------------------
;  Firmware para la placa real y para Wokwi (mismo binario)
; ----------------------------------------------------------------------------
[env:esp32dev]
platform = espressif32@8.0.0
board = esp32doit-devkit-v1
framework = arduino

monitor_speed = 115200
; Si el cable/placa no flashea a 921600, bajar a 460800 o 115200.
upload_speed = 921600
board_build.f_cpu = 240000000L

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DCORE_DEBUG_LEVEL=0

monitor_filters = esp32_exception_decoder

lib_deps =
    bogde/HX711@0.7.5
    olikraus/U8g2@2.36.18
    ; Etapa 5 (conectividad), descomentar cuando toque:
    ; knolleary/PubSubClient@2.8
    ; bblanchon/ArduinoJson@7.4.3

; ----------------------------------------------------------------------------
;  Tests nativos: logica pura sin Arduino (scheduler, filtros, calibracion)
;  No compila src/ para evitar dependencias de Arduino.
; ----------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags =
    -std=gnu++17
    -DUNIT_TEST
    -Iinclude
